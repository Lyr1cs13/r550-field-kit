    robot_base_frame: base_footprint
    odom_topic: /odom_combined
    bt_loop_duration: 50
    default_server_timeout: 20
    error_code_names:
    - compute_path_error_code
    - follow_path_error_code
bt_navigator_rclcpp_node:
  ros__parameters:
    use_sim_time: false
controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0
    controller_plugins:
    - FollowPath
    - PointPosition
    - PointRecovery
    - PointHeading
    - PointPose
    odom_topic: /odom
    progress_checker_plugin: progress_checker
    goal_checker_plugin: goal_checker
    progress_checker:
      plugin: nav2_controller::PoseProgressChecker
      required_movement_radius: 0.03
      movement_time_allowance: 20.0
      required_movement_angle: 0.035
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.025
      yaw_goal_tolerance: 0.05235987756
      stateful: true
      trans_stopped_velocity: 0.015
      rot_stopped_velocity: 0.03
    FollowPath:
      plugin: dwb_core::DWBLocalPlanner
      min_vel_x: -0.06
      min_vel_y: 0.0
      max_vel_x: 0.2
      max_vel_y: 0.0
      max_vel_theta: 0.22
      min_speed_xy: 0.01
      max_speed_xy: 0.2
      min_speed_theta: 0.1
      acc_lim_x: 0.25
      acc_lim_y: 0.0
      acc_lim_theta: 0.25
      decel_lim_x: -0.25
      decel_lim_y: 0.0
      decel_lim_theta: -0.25
      vx_samples: 20
      vy_samples: 0
      vtheta_samples: 40
      sim_time: 1.7
      angular_granularity: 0.05
      transform_tolerance: 0.2
      xy_goal_tolerance: 0.025
      trans_stopped_velocity: 0.02
      short_circuit_trajectory_evaluation: true
      stateful: true
      critics:
      - RotateToGoal
      - Oscillation
      - BaseObstacle
      - GoalAlign
      - PathAlign
      - PathDist
      - GoalDist
      BaseObstacle.scale: 1.0
      PathAlign.scale: 32.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 24.0
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: 1.2
      Oscillation.oscillation_reset_dist: 0.05
      Oscillation.oscillation_reset_angle: 0.05
    goal_checker_plugins:
    - goal_checker
    - point_position_checker
    - recovery_position_checker
    - point_heading_checker
    - point_pose_checker
    point_position_checker:
      plugin: nav2_controller::PositionGoalChecker
      xy_goal_tolerance: 0.035
      stateful: true
    point_heading_checker:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.1
      yaw_goal_tolerance: 0.05235987756
      stateful: true
    PointPosition:
      plugin: nav2_rotation_shim_controller::RotationShimController
      desired_linear_vel: 0.2
      lookahead_dist: 0.5
      min_lookahead_dist: 0.45
      max_lookahead_dist: 0.65
      lookahead_time: 2.5
      use_velocity_scaled_lookahead_dist: true
      rotate_to_heading_angular_vel: 0.18
      rotate_to_heading_min_angle: 0.45
      max_angular_accel: 0.4
      use_rotate_to_heading: false
      allow_reversing: false
      min_approach_linear_velocity: 0.025
      approach_velocity_scaling_dist: 0.5
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.025
      cost_scaling_dist: 0.15
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 3.0
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      transform_tolerance: 0.2
      use_interpolation: true
      primary_controller: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      angular_dist_threshold: 0.3
      angular_disengage_threshold: 0.1
      forward_sampling_distance: 0.45
      simulate_ahead_time: 1.0
      rotate_to_goal_heading: false
      closed_loop: false
    PointRecovery:
      plugin: dwb_core::DWBLocalPlanner
      min_vel_x: 0.0
      min_vel_y: 0.0
      max_vel_x: 0.1
      max_vel_y: 0.0
      max_vel_theta: 0.22
      min_speed_xy: 0.01
      max_speed_xy: 0.1
      min_speed_theta: 0.1
      acc_lim_x: 0.25
      acc_lim_y: 0.0
      acc_lim_theta: 0.25
      decel_lim_x: -0.25
      decel_lim_y: 0.0
      decel_lim_theta: -0.25
      vx_samples: 20
      vy_samples: 0
      vtheta_samples: 40
      sim_time: 1.2
      angular_granularity: 0.05
      transform_tolerance: 0.2
      xy_goal_tolerance: 0.1
      trans_stopped_velocity: 0.02
      short_circuit_trajectory_evaluation: true
      stateful: true
      critics:
      - ObstacleFootprint
      - Oscillation
      - PathAlign
      - PathDist
      - GoalDist
      BaseObstacle.scale: 1.0
      PathAlign.scale: 32.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 24.0
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: 1.2
      Oscillation.oscillation_reset_dist: 0.05
      Oscillation.oscillation_reset_angle: 0.05
      ObstacleFootprint.scale: 0.02
    recovery_position_checker:
      plugin: nav2_controller::PositionGoalChecker
      xy_goal_tolerance: 0.1
      stateful: true
    PointHeading:
      plugin: dwb_core::DWBLocalPlanner
      min_vel_x: 0.0
      min_vel_y: 0.0
      max_vel_x: 0.0
      max_vel_y: 0.0
      max_vel_theta: 0.2
      min_speed_xy: 0.01
      max_speed_xy: 0.0
      min_speed_theta: 0.035
      acc_lim_x: 0.25
      acc_lim_y: 0.0
      acc_lim_theta: 0.35
      decel_lim_x: -0.25
      decel_lim_y: 0.0
      decel_lim_theta: -0.6
      vx_samples: 1
      vy_samples: 0
      vtheta_samples: 101
      sim_time: 1.0
      angular_granularity: 0.05
      transform_tolerance: 0.2
      xy_goal_tolerance: 0.1
      trans_stopped_velocity: 0.02
      short_circuit_trajectory_evaluation: true
      stateful: true
      critics:
      - ObstacleFootprint
      - RotateToGoal
      BaseObstacle.scale: 1.0
      PathAlign.scale: 32.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 24.0
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: 0.5
      Oscillation.oscillation_reset_dist: 0.05
      Oscillation.oscillation_reset_angle: 0.05
      ObstacleFootprint.scale: 0.02
    point_pose_checker:
      plugin: nav2_controller::StoppedGoalChecker
      xy_goal_tolerance: 0.04
      yaw_goal_tolerance: 0.05235987756
      stateful: false
      trans_stopped_velocity: 0.015
      rot_stopped_velocity: 0.03
    PointPose:
      plugin: nav2_mppi_controller::MPPIController
      time_steps: 40
      model_dt: 0.05
      batch_size: 400
      iteration_count: 1
      vx_std: 0.035
      vy_std: 0.0
      wz_std: 0.12
      vx_max: 0.06
      vx_min: -0.04
      vy_max: 0.0
      wz_max: 0.16
      temperature: 0.05
      gamma: 0.015
      motion_model: DiffDrive
      prune_distance: 1.0
      transform_tolerance: 0.2
      visualize: false
      reset_period: 1.0
      retry_attempt_limit: 1
      critics:
      - ConstraintCritic
      - ObstaclesCritic
      - GoalCritic
      - GoalAngleCritic
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      ObstaclesCritic:
        enabled: true
        cost_power: 1
        repulsion_weight: 0.2
        critical_weight: 20.0
        consider_footprint: true
        collision_cost: 1000000.0
        collision_margin_distance: 0.02
        near_goal_distance: 0.5
        cost_scaling_factor: 3.0
        inflation_radius: 0.15
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 60.0
        threshold_to_consider: 0.5
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 1.0
        threshold_to_consider: 0.5
controller_server_rclcpp_node:
  ros__parameters:
    use_sim_time: false
local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom_combined
      robot_base_frame: base_footprint
      use_sim_time: false
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.02
      footprint: '[ [-0.1150, -0.0900], [-0.1150, 0.0900], [0.1150, 0.0900], [0.1150,
        -0.0900] ]'
      plugins:
      - voxel_layer
      - inflation_layer
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 3.0
        inflation_radius: 0.15
      voxel_layer:
        plugin: nav2_costmap_2d::VoxelLayer
        enabled: true
        publish_voxel_map: true
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: scan scan2
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: LaserScan
          raytrace_max_range: 10.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
        scan2:
          topic: /scan2
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: LaserScan
          raytrace_max_range: 10.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      always_send_full_costmap: true
      filters:
      - threshold_keepout
      threshold_keepout:
        plugin: nav2_costmap_2d::KeepoutFilter
        enabled: true
        filter_info_topic: /threshold_filter_info
  local_costmap_client:
    ros__parameters:
      use_sim_time: false
  local_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: false
global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      use_sim_time: false
      footprint: '[ [-0.1150, -0.0900], [-0.1150, 0.0900], [0.1150, 0.0900], [0.1150,
        -0.0900] ]'
      resolution: 0.05
      track_unknown_space: true
      plugins:
      - static_layer
      - obstacle_layer
      - inflation_layer
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan scan2
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: LaserScan
          raytrace_max_range: 10.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
        scan2:
          topic: /scan2
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: LaserScan
          raytrace_max_range: 10.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 5.0
        inflation_radius: 0.25
      always_send_full_costmap: true
      filters:
      - threshold_keepout
      threshold_keepout:
        plugin: nav2_costmap_2d::KeepoutFilter
        enabled: true
        filter_info_topic: /threshold_filter_info
  global_costmap_client:
    ros__parameters:
      use_sim_time: false
  global_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: false
map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: WHEELTEC.yaml
map_saver:
  ros__parameters:
    use_sim_time: false
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: true
planner_server:
  ros__parameters:
    expected_planner_frequency: 1.0
    use_sim_time: false
    planner_plugins:
    - GridBased
    - WaypointGrid
    GridBased:
      plugin: nav2_navfn_planner/NavfnPlanner
      tolerance: 0.0
      use_astar: true
      allow_unknown: false
      use_final_approach_orientation: false
    WaypointGrid:
      plugin: nav2_smac_planner/SmacPlanner2D
      tolerance: 0.0
      downsample_costmap: false
      allow_unknown: false
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 1.0
      cost_travel_multiplier: 2.0
      use_final_approach_orientation: false
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10
planner_server_rclcpp_node:
  ros__parameters:
    use_sim_time: false
smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins:
    - simple_smoother
    simple_smoother:
      plugin: nav2_smoother::SimpleSmoother
      tolerance: 1.0e-06
      max_its: 3000
      do_refinement: true
      w_data: 0.0
      w_smooth: 0.4
robot_state_publisher:
  ros__parameters:
    use_sim_time: false
waypoint_follower:
  ros__parameters:
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: wait_at_waypoint
    wait_at_waypoint:
      plugin: nav2_waypoint_follower::WaitAtWaypoint
      enabled: true
      waypoint_pause_duration: 200
behavior_server:
  ros__parameters:
    use_sim_time: false
    global_frame: odom_combined
    robot_base_frame: base_footprint
    transform_tolerance: 0.2
    cycle_frequency: 20.0
    max_rotational_vel: 0.25
    min_rotational_vel: 0.12
    rotational_acc_lim: 0.12
demo_arrival:
  ros__parameters:
    enabled: true
    nominal_speed: 0.2
    approach_speed: 0.1
    creep_speed: 0.05
    approach_distance: 0.65
    creep_distance: 0.2
    final_spin: false
    waypoint_position_then_heading: true
    heading_timeout: 30.0
    heading_retries: 1
    final_position_tolerance: 0.05
    docking_timeout: 90.0
    allow_near_arrival: false
    near_position_tolerance: 0.08
    near_yaw_tolerance: 0.0872664626
    joint_terminal_controller: true
velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: true
    feedback: OPEN_LOOP
    max_velocity:
    - 0.2
    - 0.0
    - 0.3
    min_velocity:
    - -0.1
    - 0.0
    - -0.3
    max_accel:
    - 0.5
    - 0.0
    - 0.6
    max_decel:
    - -1.0
    - 0.0
    - -0.8
    deadband_velocity:
    - 0.0
    - 0.0
    - 0.0
    velocity_timeout: 0.3
    odom_topic: /odom_combined
    odom_duration: 0.1

