<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>机器人巡航</title>
<link rel="stylesheet" href="/vendor/tabler.min.css">
<link rel="stylesheet" href="/style.css">
</head>
<body data-bs-theme="light">
<header>
  <div class="brand">
    <span class="brand-icon"><svg class="icon" aria-hidden="true"><use href="/vendor/icons.svg#radar"></use></svg></span>
    <h1 id="vehicle-title">机器人巡航</h1>
  </div>
  <div class="header-right">
    <a id="site-open" class="btn" target="_blank" rel="noopener" hidden>新场地建图</a>
    <a id="fleet-open" class="btn" href="http://127.0.0.1:8893/" hidden>巡航管理</a>
    <div class="connection-status" id="connection-state"><i></i><span>连接中</span></div>
    <button id="theme-toggle" class="icon-button" title="切换深浅主题" aria-label="切换深浅主题"><svg class="icon" aria-hidden="true"><use href="/vendor/icons.svg#moon"></use></svg></button>
    <button id="stop" class="danger"><svg class="icon" aria-hidden="true"><use href="/vendor/icons.svg#player-stop"></use></svg>停止任务</button>
  </div>
</header>
<div id="offline-banner" class="notice" hidden>离线演练 · 模拟导航</div>
<div id="vehicle-offline" class="notice" role="status" hidden>实车离线 · 已保存地图</div>
<div id="fleet-wait" class="notice" role="status" hidden></div>
<main>
  <aside>
    <section class="status-card">
      <h2 id="phase">等待连接</h2>
      <p id="message" hidden></p>
      <div class="progress" id="progress" hidden></div>
      <div class="telemetry">
        <div><span>电压</span><strong id="voltage">—</strong></div>
        <div><span>充电</span><strong id="charging">—</strong><small id="charge-current"></small></div>
        <div><span>停留剩余</span><strong id="remaining">—</strong></div>
      </div>
    </section>

    <section class="localization">
      <div class="section-title"><h3>定位</h3><span id="loc-badge" class="small-badge">待定位</span></div>
      <p id="readiness" role="status" hidden></p>
      <div class="two-buttons">
        <button id="initial-dock" title="车辆已贴合原桩时校准">在桩位校准</button>
        <button id="confirm" class="outline-primary" title="确认车头与红色雷达已对齐地图">确认定位</button>
        <button id="align-pose" title="用长墙和固定边缘精校当前位置">雷达精校</button>
      </div>
    </section>

    <section class="mission-controls">
      <div class="section-title"><h3>巡航与回充</h3></div>
      <button id="start" class="primary wide"><svg class="icon" aria-hidden="true"><use href="/vendor/icons.svg#player-play"></use></svg>开始巡航</button>
      <div class="task-buttons">
        <button id="pause"><svg class="icon" aria-hidden="true"><use href="/vendor/icons.svg#player-pause"></use></svg>暂停</button>
        <button id="resume"><svg class="icon" aria-hidden="true"><use href="/vendor/icons.svg#player-play"></use></svg>继续</button>
        <button id="return" class="dock-button"><svg class="icon" aria-hidden="true"><use href="/vendor/icons.svg#arrow-back-up"></use></svg>主动回充</button>
      </div>
      <div class="task-options">
        <label class="check"><input id="auto-return" type="checkbox" checked>结束后回充</label>
        <label class="check"><input id="repeat" type="checkbox">循环巡航</label>
      </div>
      <p id="endurance-status" class="hint" hidden></p>
    </section>

    <section class="collection-controls">
      <details id="collection-options" class="feature-group">
        <summary><strong>采集</strong><span id="collection-summary" class="small-badge">关闭</span></summary>
        <div class="feature-fields">
          <label>采集方式
            <select id="collection-mode" class="form-select">
              <option value="timed">定时停留</option>
              <option value="broadcast_station">WS63 · 固定基站定点</option>
              <option value="broadcast">WS63 · 沿途广播</option>
            </select>
          </label>
          <label id="serial-field" hidden>WS63 串口
            <input id="collection-device" list="collection-ports" class="form-control" value="auto" placeholder="/dev/serial/by-id/...">
          </label>
          <datalist id="collection-ports"></datalist>
          <button id="collection-apply" class="wide" disabled>应用设置</button>
          <p id="collection-status" class="hint" role="status" hidden></p>

          <details class="feature-subgroup"><summary>双频基站 · WS63 + ESP32-C5</summary>
            <p>双车到点停稳后同时发包，基站记录两车的双频信号。</p>
            <p>联调顺序：连接两车发端与基站 → 静止收包核对车辆身份 → 启用位置对采集。</p>
            <p id="dual-preflight" role="status">等待车端配置</p>
          </details>
          <details class="feature-subgroup">
            <summary>北区回环与基站</summary>
            <div class="two-buttons">
              <button id="survey-load" title="只加载点位">加载北区回环</button>
              <button id="survey-restore">恢复先前点位</button>
            </div>
            <label>基站摆放记录<input id="anchor-notes" class="form-control" placeholder="位置与天线朝向"></label>
            <label>天线高度（米）<input id="anchor-height" class="form-control" type="number" min="0.01" max="5" step="0.01"></label>
            <button id="anchor-save" class="wide">保存基站信息</button>
          </details>
          <details class="feature-subgroup">
            <summary>结果与导出</summary>
            <button id="collection-export" class="wide">导出当前采集记录</button>
            <a data-vehicle-link href="/rssi" target="_blank" rel="noopener">RSSI 热力图 ↗</a>
          </details>
        </div>
      </details>
    </section>

    <section class="points-section">
      <div class="section-title">
        <h3>导航点 <span id="point-count">0</span></h3>
        <button id="add-point" class="outline-primary small"><svg class="icon" aria-hidden="true"><use href="/vendor/icons.svg#plus"></use></svg>地图加点</button>
      </div>
      <div id="points"></div>
      <div id="empty-points" class="empty"><span id="points-empty-title">暂无导航点</span></div>
      <details class="feature-subgroup point-tools">
        <summary>批量设置与点位文件</summary>
        <div class="file-actions"><label>统一朝向（度）<input id="shared-heading" class="form-control" type="number" min="-180" max="180" step="0.1" value="0"></label><button id="apply-heading">应用到全部</button></div>
        <button id="recover-points" class="wide" hidden>载入未完成点位</button>
        <div class="file-actions">
          <button id="export"><svg class="icon" aria-hidden="true"><use href="/vendor/icons.svg#download"></use></svg>导出点位</button>
          <button id="import"><svg class="icon" aria-hidden="true"><use href="/vendor/icons.svg#upload"></use></svg>导入点位</button>
          <input id="file" type="file" accept="application/json,.json" hidden>
        </div>
      </details>
    </section>
  </aside>

  <div class="workspace">
    <section class="map-panel">
      <div class="map-header">
        <div><h3><svg class="icon" aria-hidden="true"><use href="/vendor/icons.svg#map-2"></use></svg>场景地图 <span id="map-live" class="map-live" hidden></span></h3><p id="map-version"></p></div>
        <div class="map-toolbar">
          <button id="simulation-points" aria-pressed="true" hidden>50 个采集点</button>
          <button id="pan-tool" class="active" title="拖动与缩放地图"><svg class="icon" aria-hidden="true"><use href="/vendor/icons.svg#arrows-move"></use></svg>平移</button>
          <button id="add-tool"><svg class="icon" aria-hidden="true"><use href="/vendor/icons.svg#map-pin"></use></svg>添加点</button>
          <button id="pose-tool"><svg class="icon" aria-hidden="true"><use href="/vendor/icons.svg#crosshair"></use></svg>设置位置</button>
          <button id="fit"><svg class="icon" aria-hidden="true"><use href="/vendor/icons.svg#maximize"></use></svg>主区域</button>
          <button id="full">全图</button>
        </div>
      </div>
      <div class="canvas-wrap">
        <canvas id="map" aria-label="场景导航地图"></canvas>
        <div class="map-tip" id="map-tip" hidden></div>
        <div class="map-coordinates" id="coordinates">+X 向上 ↑</div>
      </div>
      <div class="legend"><span><i class="wall"></i>障碍</span><span><i class="unknown"></i>未知</span><span><i class="keepout"></i>禁区</span><span><i class="robot"></i>车身</span><span><i class="charger-shape"></i>充电桩</span><span><i class="laser"></i>雷达</span><span><i class="path"></i>规划路线</span><span><i class="track"></i>定位轨迹</span></div>
    </section>
    <section class="activity"><div class="section-title"><h3><svg class="icon" aria-hidden="true"><use href="/vendor/icons.svg#activity"></use></svg>运行记录</h3></div><div id="events"></div></section>
  </div>
</main>
<div id="toast" role="status"></div>
<script src="/ui.js"></script><script src="/app.js"></script>
</body>
</html>
